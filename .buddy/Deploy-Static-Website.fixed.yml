- pipeline: deploy-static-website
  name: Deploy Static Website
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  - type: PUSH
  actions:
  - action: Git Push
    type: PUSH
    target_branch: $BUDDY_RUN_BRANCH
    comment: $BUDDY_RUN_ID
    targets:
    - project_repository
